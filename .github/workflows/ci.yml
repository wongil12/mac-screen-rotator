name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Run tests
        run: swift test

      - name: Install displayplacer
        run: brew install displayplacer

      - name: Build local app bundle
        run: scripts/build-app.sh

      - name: Verify bundle and architecture
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Mac Screen Rotator.app"
          test "$(uname -m)" = "arm64"
          file "dist/Mac Screen Rotator.app/Contents/MacOS/MacScreenRotator" | grep arm64
          file "dist/Mac Screen Rotator.app/Contents/Helpers/displayplacer" | grep arm64

      - name: Archive unsigned test bundle
        run: ditto -c -k --keepParent "dist/Mac Screen Rotator.app" "dist/Mac-Screen-Rotator-unsigned.zip"

      - name: Upload unsigned test bundle
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Screen-Rotator-unsigned
          path: dist/Mac-Screen-Rotator-unsigned.zip
          if-no-files-found: error
