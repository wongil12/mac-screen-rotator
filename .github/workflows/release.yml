name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      MAC_ROTATOR_SIGNING_IDENTITY: ${{ secrets.MAC_ROTATOR_SIGNING_IDENTITY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release secrets
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$DEVELOPER_ID_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$MAC_ROTATOR_SIGNING_IDENTITY"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release.keychain-db"
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Install displayplacer
        run: brew install displayplacer

      - name: Test
        run: swift test

      - name: Build and sign app
        env:
          MAC_ROTATOR_VERSION: ${{ github.ref_name }}
          MAC_ROTATOR_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export MAC_ROTATOR_VERSION="${MAC_ROTATOR_VERSION#v}"
          scripts/build-app.sh
          codesign --verify --deep --strict --verbose=2 "dist/Mac Screen Rotator.app"

      - name: Notarize app
        run: |
          ditto -c -k --keepParent "dist/Mac Screen Rotator.app" "$RUNNER_TEMP/MacScreenRotator.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MacScreenRotator.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/Mac Screen Rotator.app"
          xcrun stapler validate "dist/Mac Screen Rotator.app"

      - name: Create and notarize DMG
        run: |
          scripts/create-dmg.sh "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg"
          codesign --force --timestamp \
            --sign "$MAC_ROTATOR_SIGNING_IDENTITY" \
            "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg"
          codesign --verify --strict --verbose=2 \
            "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg"
          xcrun notarytool submit "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg"
          xcrun stapler validate "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 \
            "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg"

      - name: Create checksum
        run: |
          cd dist
          shasum -a 256 "Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg" \
            > "Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg" \
            "dist/Mac-Screen-Rotator-${GITHUB_REF_NAME}.dmg.sha256" \
            --title "Mac Screen Rotator ${GITHUB_REF_NAME}" \
            --generate-notes
